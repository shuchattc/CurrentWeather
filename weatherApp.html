<!DOCTYPE html>
<html>
    <head>
        
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
        <link rel="stylesheet" href = "app.css"></script>
    </head>
    <body>
        <div class="container col-6 offset-3">
            <p>Enter the city of your choice to find the current weather.</p>
            <form class="col-sm-6 col-md-3 col-lg-3 align-items-center border" id="searchForm">
                <input class="col-8 m-3" type="text" placeholder="City Name" name="query" id="cityName" required><br>
                <input class="form-check-input ms-3" type="radio" id="temp_type_F" name="temp_type" value="temp_type_F">
                <label for="temp_type_F">F</label><br>
                <input class="form-check-input ms-3" type="radio" id="temp_type_C" name="temp_type" value="temp_type_C">
                <label for="temp_type_C">C</label><br>
                <button class="btn btn-success m-3" id="s">Search</button>
            </form>
            <div id ="iconArea"></div>
        </div>
        
        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <script src="app.js"></script>
    </body>
</html>
